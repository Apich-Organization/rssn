[package]
name = "rssn-io-codec-study"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
zstd = { version = "=0.14.4", default-features = false }
brotli = { version = "=8.0.4", default-features = false, features = ["std"] }
libc = "=0.2.191"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[[bin]]
name = "rssn-io-codec-study"
path = "src/main.rs"
test = false
