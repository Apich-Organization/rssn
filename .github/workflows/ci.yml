# Continuous integration. The same structure is used by the aevia repository:
# fmt -> clippy -> test (matrix) -> contracts -> docs, summarised by one
# `ci-success` job so branch protection needs a single required check.

name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Workspace `rust-version`; the toolchain every gate below uses.
  RUST_TOOLCHAIN: "1.97"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y fontconfig libfontconfig1-dev
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fontconfig libfontconfig1-dev
      - run: cargo test --workspace --all-features

  contracts:
    name: contracts (signature audit, generated bindings)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y fontconfig libfontconfig1-dev
      - name: Every operator is typed or explained
        run: cargo run --bin signature-audit
      - name: Generated numerical bindings are current
        run: |
          cargo run -p rssn-api-gen -- --bindings-check
          cargo run -p rssn-api-gen -- --structured-check
          cargo run -p rssn-api-gen -- --contracts-check

  ffi:
    name: C interface (headers, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y fontconfig libfontconfig1-dev
      - name: Regenerate headers and build the C libraries
        run: DEV=1 bash scripts/build_ffi.sh --features dev-headers
      - name: Checked-in headers are current
        run: git diff --exit-code -- rssn.h rssn.hpp
      - name: Build and run the C smoke test
        run: |
          cc -I. examples/c/smoke.c target/release/librssn.a -lm -lpthread -ldl -o smoke
          ./smoke

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y fontconfig libfontconfig1-dev
      - run: cargo doc --workspace --no-deps --all-features

  ci-success:
    name: CI success
    if: always()
    needs: [fmt, clippy, test, contracts, ffi, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
