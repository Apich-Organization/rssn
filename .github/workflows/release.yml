# Continuous delivery. Triggered manually via workflow_dispatch (immutable
# releases: no push-tag trigger): builds the C libraries across six platforms,
# creates a draft GitHub release with checksummed archives, and publishes the
# crate to crates.io after a manual approval of the `crates-io` environment.
#
# Required repository setup: an environment named `crates-io` (with required
# reviewers) holding the secret CARGO_REGISTRY_TOKEN.

name: Release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 3.0.0-rc.1); defaults to Cargo.toml version if empty"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Build the artifacts without creating a release or publishing"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97"

jobs:
  verify:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION#v}"
          else
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "rssn") | .version')
          fi
          echo "release version: $version"
          if [ -z "$version" ]; then echo "::error::no release version found"; exit 1; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "prerelease=${pre}" >> "$GITHUB_OUTPUT"

  ffi:
    name: C libraries (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64, rust_target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: linux-aarch64, rust_target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: windows-x86_64, rust_target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: windows-aarch64, rust_target: aarch64-pc-windows-msvc }
          - { os: macos-latest, target: macos-x86_64, rust_target: x86_64-apple-darwin }
          - { os: macos-latest, target: macos-aarch64, rust_target: aarch64-apple-darwin }
    env:
      # Distribution binaries must not depend on the CPU of the build host
      # (.cargo/config.toml selects `native` for local development).
      RUSTFLAGS: "-C target-cpu=generic"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: System dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fontconfig libfontconfig1-dev
      - name: Build and package FFI libraries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/build_ffi.sh \
            --target "${{ matrix.rust_target }}" \
            --package \
            --dist-name "rssn-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
      - name: Build and package FFI libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          scripts/build_ffi.ps1 `
            -Target "${{ matrix.rust_target }}" `
            -Package `
            -DistName "rssn-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: rssn-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  github-release:
    name: GitHub release
    needs: [verify, ffi]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes
        run: |
          python3 scripts/extract_changelog.py \
            --version "${{ needs.verify.outputs.version }}" \
            --output release_notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ needs.verify.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "v${{ needs.verify.outputs.version }}" dist/* \
            --title "rssn ${{ needs.verify.outputs.version }}" \
            --draft \
            --notes-file release_notes.md \
            "${flags[@]}"

  publish:
    name: Publish to crates.io
    needs: [verify, ffi]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y fontconfig libfontconfig1-dev
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
