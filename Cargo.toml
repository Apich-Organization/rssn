[package]
name = "rssn"
version = "0.2.13"
edition = "2024"
rust-version = "1.96.0"
authors = ["The rssn developers"]
description = "A comprehensive scientific computing library for Rust, aiming for feature parity with NumPy and SymPy."
license = "Apache-2.0"
repository = "https://github.com/Apich-Organization/rssn"
homepage = "https://github.com/Apich-Organization/rssn"
readme = "README.md"

keywords = [
    "scientific-computing",
    "symbolic-math",
    "numerical-analysis",
    "physics-simulation",
    "optimization",
]
categories = [
    "science",
    "mathematics",
    "data-structures",
    "simulation",
    "algorithms",
]
exclude = [
    "doc/*",
    ".gitea/*",
    ".github/*",
    ".vscode/*",
    ".idea/*",
    "*.sh",
    "*.bat",
    "scripts/*",
    "docs/*",
    "certificates/*",
]

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[profile.dev]
lto = false
opt-level = 0
debug = true
incremental = true

# The symbolic test suite runs thousands of nested engine runs and numeric
# integrations; unoptimised builds make it several times slower.
[profile.test]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
debug = false
debug-assertions = false
overflow-checks = false
incremental = true

[dependencies]
# Not upgrading because of argmin
ndarray = { version = "0.16", features = ["serde"] }
statrs = "0.19"
argmin-math = { version = "0.5", features = ["ndarray_latest-nolinalg"] }
argmin = { version = "0.11", features = ["serde", "serde1"] }
rustfft = "6.4"
sprs-rssn = "0.11"
# Not upgrading because of argmin requires ndarray 0.16
ndarray-npy = { version = "0.9", optional = true }
rayon = "1.11"
rand_v09 = { package = "rand", version = "0.9" }
# `rand_v10` (rand 0.10.0) is needed by faer.
rand_v10 = { package = "rand", version = "0.10" }
num-complex = { version = "0.4", features = ["serde"] }
num-bigint = { version = "0.4", features = ["serde", "rand"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

[dependencies.faer]
version = "0.24"
default-features = false
features = ["std", "sparse-linalg", "rand"]

[build-dependencies]
cbindgen = "0.29"
vergen = { version = "10.0", features = [
    "build",
    "cargo",
    "cargo_metadata",
    "emit_and_set",
    "regex",
    "rustc",
    "rustc_version",
    "si",
    "sysinfo",
    "time",
] }
vergen-gitcl = { version = "10.0", features = [
    "build",
    "cargo",
    "emit_and_set",
    "rustc",
    "si",
] }

[features]
default = []
# Reading and writing `.npy` files in `rssn::io`.
npy = ["dep:ndarray-npy"]
full = ["npy"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.9"
assert_approx_eq = "1.1"

[[bench]]
name = "engine"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "doc-header.html"]

[lints.clippy]
empty-line-after-doc-comments = "allow"

[lints.rust]
# Allowed here because of kani.
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(has_foo)'] }
