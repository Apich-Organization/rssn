# cbindgen configuration for rssn
language = "C"
cpp_compat = true
include_guard = "RSSN_H"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
include_version = true
namespace = "rssn"
namespaces = []
tab_width = 4
line_length = 100
documentation = true
documentation_style = "doxy"
usize_is_size_t = true
after_includes = """
/** The handle value that means "no term" (a failed constructor). */
#define RSSN_NO_TERM UINT32_MAX
"""

[defines]
"target_os = windows" = "RSSN_WINDOWS"
"target_os = linux" = "RSSN_LINUX"
"target_os = macos" = "RSSN_MACOS"

[export]
include = []
# Rust-only types that are public but never cross the C boundary.
exclude = ["Color", "Facts", "OpFlags"]
item_types = ["enums", "structs", "typedefs", "opaque", "functions"]

[export.rename]

[export.body]

[export.mangle]

[fn]
rename_args = "None"
must_use = "MUST_USE_FUNC"
deprecated = "DEPRECATED"
deprecated_with_note = "DEPRECATED_WITH_NOTE"
no_return = "NO_RETURN"
args = "Auto"
sort_by = "Name"

[struct]
rename_fields = "None"
must_use = "MUST_USE_STRUCT"
deprecated = "DEPRECATED"
deprecated_with_note = "DEPRECATED_WITH_NOTE"
derive_constructor = true
derive_eq = true
derive_neq = true
derive_lt = true
derive_lte = true
derive_gt = true
derive_gte = true

[enum]
rename_variants = "ScreamingSnakeCase"
must_use = "MUST_USE_ENUM"
deprecated = "DEPRECATED"
deprecated_with_note = "DEPRECATED_WITH_NOTE"
prefix_with_name = true
derive_helper_methods = true
derive_const_casts = true
derive_mut_casts = true
cast_assert_name = "ASSERT"
derive_tagged_enum_destructor = true
derive_tagged_enum_copy_constructor = true
derive_tagged_enum_copy_assignment = true
private_default_tagged_enum_constructor = true

[const]
allow_static_const = true
allow_constexpr = true
sort_by = "Name"

[macro_expansion]
bitflags = true

[parse]
parse_deps = false
include = []
exclude = []
clean = false
extra_bindings = []

[parse.expand]
crates = []
