[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rssn"
version = "3.0.0b1"
description = "Python bindings for rssn: symbolic, numeric and simulation kernels through one API"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "The rssn developers" }]
keywords = ["symbolic", "cas", "scientific-computing", "numerical", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Apich-Organization/rssn"

[tool.setuptools]
packages = ["rssn"]

[tool.setuptools.package-data]
rssn = ["py.typed", "_lib/*"]
